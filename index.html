/* ==================================================

function formatPrice(price) {

    return "السعر غير متوفر";

  return price + " مليون د.ع";

/* ==================================================

function loadFilters() {

  const brandFilter =
    document.getElementById("brandFilter");

  const typeFilter =
    document.getElementById("typeFilter");

  const fuelFilter =
    document.getElementById("fuelFilter");

  const yearFilter =
    document.getElementById("yearFilter");


  if (!brandFilter) return;


  const brands = [
    ...new Set(
      cars.map(car => car.brand)
    )
  ];


  const types = [
    ...new Set(
      cars.map(car => car.type)
    )
  ];


  const fuels = [
    ...new Set(
      cars.map(car => car.fuel)
    )
  ];


  const years = [
    ...new Set(
      cars.map(car => car.year)
    )
  ];


  brands.forEach(brand => {

    brandFilter.innerHTML += `
      <option value="${brand}">
        ${brand}
      </option>
    `;

  });


  types.forEach(type => {

    typeFilter.innerHTML += `
      <option value="${type}">
        ${type}
      </option>
    `;

  });


  fuels.forEach(fuel => {

    fuelFilter.innerHTML += `
      <option value="${fuel}">
        ${fuel}
      </option>
    `;

  });


  years
    .sort((a, b) => b - a)
    .forEach(year => {

      yearFilter.innerHTML += `
        <option value="${year}">
          ${year}
        </option>
      `;

    });

}


/* ==================================================
   FILTER DATABASE
================================================== */

function filterDatabase() {

  const search =
    document
      .getElementById("databaseSearch")
      .value
      .toLowerCase()
      .trim();


  const brand =
    document.getElementById("brandFilter").value;


  const type =
    document.getElementById("typeFilter").value;


  const fuel =
    document.getElementById("fuelFilter").value;


  const year =
    document.getElementById("yearFilter").value;


  const price =
    document.getElementById("priceFilter").value;


  const sort =
    document.getElementById("sortFilter").value;


  let result = cars.filter(car => {

    const fullName =
      `${car.brand} ${car.model}`.toLowerCase();


    const matchesSearch =
      !search ||
      fullName.includes(search) ||
      car.engine.toLowerCase().includes(search);


    const matchesBrand =
      !brand || car.brand === brand;


    const matchesType =
      !type || car.type === type;


    const matchesFuel =
      !fuel || car.fuel === fuel;


    const matchesYear =
      !year || String(car.year) === year;


    let matchesPrice = true;


    if (price === "under30") {

      matchesPrice = car.price < 30;

    }


    if (price === "30-60") {

      matchesPrice =
        car.price >= 30 &&
        car.price <= 60;

    }


    if (price === "60-100") {

      matchesPrice =
        car.price > 60 &&
        car.price <= 100;

    }


    if (price === "over100") {

      matchesPrice = car.price > 100;

    }


    return (
      matchesSearch &&
      matchesBrand &&
      matchesType &&
      matchesFuel &&
      matchesYear &&
      matchesPrice
    );

  });


  /* SORT */

  if (sort === "priceLow") {

    result.sort(
      (a, b) => a.price - b.price
    );

  }


  if (sort === "priceHigh") {

    result.sort(
      (a, b) => b.price - a.price
    );

  }


  if (sort === "powerHigh") {

    result.sort(
      (a, b) => b.power - a.power
    );

  }


  if (sort === "yearNew") {

    result.sort(
      (a, b) => b.year - a.year
    );

  }


  filteredCars = result;

  renderDatabase(result);

}

  } else {

  }


  renderDatabase(filteredCars);

    "priceFilter",

    if (element) {

  const databaseSearch =

  const value =
    input.value.trim();


  if (databaseSearch) {

    databaseSearch.value = value;

    filterDatabase();

  }


  const database =
    document.getElementById("car-database");


  if (database) {

    database.scrollIntoView({
      behavior: "smooth"
    });

  }

}

      "dark-mode"
    );


  if (isDark) {

    document.body.style.background =
      "#020617";

    document.body.style.color =
      "#f8fafc";

  } else {

    document.body.style.background =
      "#f5f7fb";

    document.body.style.color =

  }

========================================================= */

function saveFavorites() {

  localStorage.setItem(
    "iraqCarsFavorites",
    JSON.stringify(favorites)
  );

}


function loadFavorites() {

  try {

    const saved =
      localStorage.getItem(
        "iraqCarsFavorites"
      );

    if (saved) {

      favorites =
        JSON.parse(saved);

    }

  } catch (error) {

    favorites = [];

  }

}


/* =========================================================
   UPDATE FAVORITES
========================================================= */

function toggleFavorite(id) {

  const index =
    favorites.indexOf(id);

  if (index === -1) {

    favorites.push(id);

    showMessage(
      "❤️ تمت إضافة السيارة للمفضلة"
    );

  } else {

    favorites.splice(index, 1);

    showMessage(
      "تم حذف السيارة من المفضلة"
    );

  }

  saveFavorites();

  renderDatabase(filteredCars);

}


/* =========================================================
   MESSAGE SYSTEM
========================================================= */

function showMessage(message) {

  let box =
    document.getElementById(
      "iraqMessage"
    );


  if (!box) {

    box =
      document.createElement("div");

    box.id =
      "iraqMessage";


    box.style.position =
      "fixed";

    box.style.bottom =
      "25px";

    box.style.left =
      "50%";

    box.style.transform =
      "translateX(-50%)";

    box.style.background =
      "#111827";

    box.style.color =
      "#ffffff";

    box.style.padding =
      "14px 22px";

    box.style.borderRadius =
      "12px";

    box.style.zIndex =
      "99999";

    box.style.fontSize =
      "14px";

    box.style.boxShadow =
      "0 10px 30px rgba(0,0,0,.25)";

    box.style.transition =
      "all .3s ease";


    document.body.appendChild(box);

  }


  box.textContent =
    message;


  box.style.opacity =
    "1";


  clearTimeout(
    window.iraqMessageTimer
  );


  window.iraqMessageTimer =
    setTimeout(function() {

      box.style.opacity =
        "0";

    }, 2200);

}

  return cars.filter(
    car =>
      favorites.includes(car.id)

}

========================================================= */

  const list =

  if (list.length === 0) {

    showMessage(
      "ما عندك سيارات بالمفضلة ❤️"
    );

    return;

  }


  renderDatabase(list);


  const database =
    document.getElementById(
      "car-database"
    );


  if (database) {

    database.scrollIntoView({
      behavior: "smooth"
    });

  }

}


/* =========================================================
   COMPARE SYSTEM
========================================================= */

let compareCars = [];


function addToCompare(id) {

  const car =
    cars.find(
      item => item.id === id
    );


  if (!car) return;


  if (
    compareCars.some(
      item => item.id === id
    )
  ) {

    showMessage(
      "السيارة موجودة بالمقارنة"
    );

    return;

  }


  if (compareCars.length >= 3) {

    showMessage(
      "تقدر تقارن 3 سيارات فقط"
    );

    return;

  }


  compareCars.push(car);


  showMessage(
    "⚖️ تمت إضافة السيارة للمقارنة"
  );


  updateCompareBar();

}


/* =========================================================
   REMOVE FROM COMPARE
========================================================= */

function removeFromCompare(id) {

  compareCars =
    compareCars.filter(
      car => car.id !== id
    );


  updateCompareBar();

}


/* =========================================================
   CLEAR COMPARE
========================================================= */

function clearCompare() {

  compareCars = [];

  updateCompareBar();

}


/* =========================================================
   COMPARE BAR
========================================================= */

function updateCompareBar() {

  let bar =
    document.getElementById(
      "compareBar"
    );


  if (!bar) {

    bar =
      document.createElement("div");

    bar.id =
      "compareBar";


    bar.style.position =
      "fixed";

    bar.style.bottom =
      "0";

    bar.style.left =
      "0";

    bar.style.right =
      "0";

    bar.style.background =
      "#111827";

    bar.style.color =
      "white";

    bar.style.padding =
      "12px";

    bar.style.zIndex =
      "9000";

    bar.style.boxShadow =
      "0 -5px 25px rgba(0,0,0,.25)";


    document.body.appendChild(bar);

  }


  if (compareCars.length === 0) {

    bar.innerHTML = "";

    bar.style.display =
      "none";

    return;

  }


  bar.style.display =
    "block";


  let names =
    compareCars.map(
      car =>
        `${car.brand} ${car.model}`
    ).join(" • ");


  bar.innerHTML = `

    <div style="
      max-width:1000px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    ">

        ⚖️

          المقارنة
        </strong>

          color:#cbd5e1;
          margin-right:8px;
        ">
          ${names}
        </span>

      </div>


      <div style="
        display:flex;
        gap:8px;
        flex-wrap:wrap;
      ">

        <button
          onclick="showComparison()"
          style="
            border:none;
            background:#2563eb;
            color:white;
            padding:10px 16px;
            border-radius:9px;
            cursor:pointer;
          "
        >
          ⚖️ قارن الآن
        </button>


        <button
          onclick="clearCompare()"
          style="
            border:none;
            background:#374151;
            color:white;
            padding:10px 16px;
            border-radius:9px;
            cursor:pointer;
          "
        >
          مسح
        </button>

      </div>

    </div>

  `;

}

  if (compareCars.length < 2) {

    showMessage(
      "اختار سيارتين على الأقل للمقارنة"
    );

    return;

  let modal =
    document.getElementById(

/* =========================================================
   FUEL CALCULATOR
========================================================= */

function calculateFuel() {

  const distance =
    Number(
      document.getElementById(
        "fuelDistance"
      )?.value
    );


  const consumption =
    Number(
      document.getElementById(
        "fuelConsumption"
      )?.value
    );


  const fuelPrice =
    Number(
      document.getElementById(
        "fuelPrice"
      )?.value
    );


  if (
    !distance ||
    !consumption ||
    !fuelPrice
  ) {

    showMessage(
      "دخل كل معلومات حاسبة الوقود"
    );

    return;

  }


  const liters =
    distance / consumption;


  const cost =
    liters * fuelPrice;


  const monthly =
    cost * 30;


  const yearly =
    cost * 365;


  const result =
    document.getElementById(
      "fuelResult"
    );


  if (!result) return;


  result.innerHTML = `

    <div style="
      background:#eff6ff;
      border-radius:15px;
      padding:20px;
    ">

      <h3>
        📊 نتيجة الحساب
      </h3>


      <p>
        استهلاكك اليومي:
        <strong>
          ${liters.toFixed(2)} لتر
        </strong>
      </p>


      <p>
        تكلفة اليوم:
        <strong>
          ${cost.toLocaleString()}
          د.ع
        </strong>
      </p>


      <p>
        تكلفة الشهر:
        <strong>
          ${monthly.toLocaleString()}
          د.ع
        </strong>
      </p>


      <p>
        تكلفة السنة:
        <strong>
          ${yearly.toLocaleString()}
          د.ع
        </strong>
      </p>

    </div>

  `;

}


/* =========================================================
   INSTALLMENT CALCULATOR
========================================================= */

function calculateInstallment() {

  const price =
    Number(
      document.getElementById(
        "installmentPrice"
      )?.value
    );


  const downPayment =
    Number(
      document.getElementById(
        "downPayment"
      )?.value
    ) || 0;


  const months =
    Number(
      document.getElementById(
        "installmentMonths"
      )?.value
    );


  const interest =
    Number(
      document.getElementById(
        "installmentInterest"
      )?.value
    ) || 0;


  if (
    !price ||
    !months
  ) {

    showMessage(
      "دخل سعر السيارة وعدد الأشهر"
    );

    return;

  }


  const remaining =
    Math.max(
      price - downPayment,
      0
    );


  const interestAmount =
    remaining *
    (interest / 100);


  const total =
    remaining +
    interestAmount;


  const monthly =
    total / months;


  const result =
    document.getElementById(
      "installmentResult"
    );


  if (!result) return;


  result.innerHTML = `

    <div style="
      background:#f0fdf4;
      border-radius:15px;
      padding:20px;
    ">

      <h3>
        💳 نتيجة التقسيط
      </h3>


      <p>
        المبلغ المتبقي:
        <strong>
          ${remaining.toLocaleString()}
          د.ع
        </strong>
      </p>


      <p>
        قيمة الفائدة:
        <strong>
          ${interestAmount.toLocaleString()}
          د.ع
        </strong>
      </p>


      <p>
        إجمالي المبلغ:
        <strong>
          ${total.toLocaleString()}
          د.ع
        </strong>
      </p>


      <p style="
        font-size:20px;
        color:#16a34a;
      ">

        القسط الشهري:
        <strong>
          ${monthly.toLocaleString()}
          د.ع
        </strong>

      </p>

    </div>

  `;

}


/* =========================================================
   CAR QUICK ANALYSIS
========================================================= */

function analyzeCar(id) {

  const car =
    cars.find(
      item => item.id === id
    );


  if (!car) return;


  let score = 0;


  if (car.power >= 250)
    score += 20;
  else if (car.power >= 180)
    score += 15;
  else
    score += 10;


  if (car.consumption >= 15)
    score += 25;
  else if (car.consumption >= 10)
    score += 18;
  else
    score += 10;


  if (car.seats >= 7)
    score += 15;
  else
    score += 10;


  if (
    car.fuel === "كهربائية" ||
    car.fuel === "هايبرد"
  )
    score += 20;
  else
    score += 10;


  if (car.price <= 30)
    score += 20;
  else if (car.price <= 60)
    score += 15;
  else
    score += 8;


  let level;


  if (score >= 85) {

    level =
      "ممتازة ⭐⭐⭐⭐⭐";

  } else if (score >= 70) {

    level =
      "جيدة جداً ⭐⭐⭐⭐";

  } else if (score >= 55) {

    level =
      "جيدة ⭐⭐⭐";

  } else {

    level =
      "متوسطة ⭐⭐";

  }


  alert(
    `${car.brand} ${car.model}\n\n` +
    `التقييم: ${level}\n` +
    `النتيجة: ${score}/100`
  );

}

/* =========================================================
   BRAND QUICK FILTER
========================================================= */

function filterByBrand(brand) {

  const brandFilter =
    document.getElementById(
      "brandFilter"
    );


  if (!brandFilter) return;


  brandFilter.value =
    brand;


  filterDatabase();


  const database =
    document.getElementById(
      "car-database"
    );


  if (database) {

    database.scrollIntoView({
      behavior: "smooth"
    });

  }

}


/* =========================================================
   ADD COMPARE BUTTON TO CARDS
========================================================= */

function addCompareButtons() {

  const cards =
    document.querySelectorAll(
      ".advanced-card"
    );


  cards.forEach(card => {

    const button =
      card.querySelector(
        ".compare-car-button"
      );


    if (button) return;


    const title =
      card.querySelector("h3");


    if (!title) return;


    const name =
      title.textContent.trim();


    const car =
      cars.find(item => {

        const fullName =
          `${item.brand} ${item.model}`;

        return fullName === name;

      });


    if (!car) return;


    const actions =
      card.querySelector(
        ".card-actions"
      );


    if (!actions) return;


    const compareButton =
      document.createElement(
        "button"
      );


    compareButton.className =
      "compare-car-button";


    compareButton.textContent =
      "⚖️ مقارنة";


    compareButton.style.border =
      "none";

    compareButton.style.background =
      "#f1f5f9";

    compareButton.style.color =
      "#111827";

    compareButton.style.padding =
      "10px";

    compareButton.style.borderRadius =
      "8px";

    compareButton.style.cursor =
      "pointer";


    compareButton.onclick =
      function() {

        addToCompare(car.id);

      };


    actions.appendChild(
      compareButton
    );

  });

}


/* =========================================================
   UPDATE CARD FEATURES
========================================================= */

const oldRenderDatabase =
  renderDatabase;


renderDatabase =
  function(list) {

    oldRenderDatabase(list);

    setTimeout(function() {

      addCompareButtons();

      updateFavoritesCount();

    }, 50);

  };


/* =========================================================
   CAR BRAND BUTTONS
========================================================= */

function activateBrandButtons() {

  const brands =
    document.querySelectorAll(
      ".brand"
    );


  brands.forEach(button => {

    if (
      button.dataset.activated
    ) {
      return;
    }


    button.dataset.activated =
      "true";


    const span =
      button.querySelector(
        "span"
      );


    if (!span) return;


    const brandName =
      span.textContent.trim();


    button.addEventListener(
      "click",
      function() {

        filterByBrand(
          brandName
        );

      }
    );

  });

}


/* =========================================================
   QUICK CAR ANALYSIS BUTTON
========================================================= */

function addAnalysisButtons() {

  const cards =
    document.querySelectorAll(
      ".advanced-card"
    );


  cards.forEach(card => {

    if (
      card.querySelector(
        ".analysis-button"
      )
    ) {
      return;
    }


    const title =
      card.querySelector("h3");


    if (!title) return;


    const car =
      cars.find(item =>
        `${item.brand} ${item.model}`
        ===
        title.textContent.trim()
      );


    if (!car) return;


    const actions =
      card.querySelector(
        ".card-actions"
      );


    if (!actions) return;


    const button =
      document.createElement(
        "button"
      );


    button.className =
      "analysis-button";


    button.textContent =
      "📊 تقييم";


    button.style.border =
      "none";

    button.style.background =
      "#fef3c7";

    button.style.color =
      "#92400e";

    button.style.padding =
      "10px";

    button.style.borderRadius =
      "8px";

    button.style.cursor =
      "pointer";


    button.onclick =
      function() {

        analyzeCar(
          car.id
        );

      };


    actions.appendChild(
      button
    );

  });

}


/* =========================================================
   REFRESH ALL FEATURES
========================================================= */

function refreshCarFeatures() {

  setTimeout(function() {

    addCompareButtons();

    addAnalysisButtons();

    updateFavoritesCount();

    activateBrandButtons();

  }, 100);

}


/* =========================================================
   OVERRIDE DATABASE RENDER
========================================================= */

const currentRenderDatabase =
  renderDatabase;


renderDatabase =
  function(list) {

    currentRenderDatabase(list);

    refreshCarFeatures();

  };

function initializePart4() {

  loadFavorites();

  createCalculators();

  createFavoritesButton();

  updateFavoritesCount();

  activateBrandButtons();

  refreshCarFeatures();

  updateCompareBar();

}

} else {

  initializePart4();

}

);

iraqCars.forEach((car, index) => {

  carDatabase.push({

    id: generatedID++,

    brand: car[0],

    model: car[1],

    type: car[2],

    fuel: car[3],

/*
  نضيف سنوات مختلفة لبعض الموديلات
  حتى تكون قاعدة البيانات أكبر.
*/

const originalCars =
  [...carDatabase];


for (
  let i = 0;
  carDatabase.length < 300;
  i++
) {

  const base =
    originalCars[
      i % originalCars.length
    ];


  const copy = {

    ...base,

    id: generatedID++,

    year:
      2024 -
      (Math.floor(i / originalCars.length) % 5),

    price:
      Math.max(
        10,
        base.price -
        (
          Math.floor(i / originalCars.length) *
          1.5
        )
      )

  };


  carDatabase.push(copy);

}

/* =========================================================
   FILTER
========================================================= */

function getFilteredCars() {

  const search =
    document
      .getElementById("iraqSearch")
      .value
      .toLowerCase()
      .trim();


  const brand =
    document
      .getElementById("iraqBrand")
      .value;


  const type =
    document
      .getElementById("iraqType")
      .value;


  const fuel =
    document
      .getElementById("iraqFuel")
      .value;


  const sort =
    document
      .getElementById("iraqSort")
      .value;


  let list =
    carDatabase.filter(car => {

      const name =
        `${car.brand} ${car.model}`
        .toLowerCase();


      return (

        (!search ||
          name.includes(search)) &&

        (!brand ||
          car.brand === brand) &&

        (!type ||
          car.type === type) &&

        (!fuel ||
          car.fuel === fuel)

      );

    });


  if (sort === "low") {

    list.sort(
      (a,b) =>
        a.price - b.price
    );

  }


  if (sort === "high") {

    list.sort(
      (a,b) =>
        b.price - a.price
    );

  }


  if (sort === "power") {

    list.sort(
      (a,b) =>
        b.power - a.power
    );

  }


  if (sort === "new") {

    list.sort(
      (a,b) =>
        b.year - a.year
    );

  }


  return list;

}


/* =========================================================
   RENDER 12 PER PAGE
========================================================= */

function renderNewCars(page) {

  const list =
    getFilteredCars();


  const perPage = 12;


  const totalPages =
    Math.ceil(
      list.length / perPage
    );


  if (page > totalPages)
    page = totalPages || 1;


  const start =
    (page - 1) * perPage;


  const current =
    list.slice(
      start,
      start + perPage
    );


  const grid =
    document.getElementById(
      "iraqGrid"
    );


  const results =
    document.getElementById(
      "iraqResults"
    );


  results.textContent =
    `تم العثور على ${list.length} سيارة • الصفحة ${page} من ${totalPages || 1}`;


  grid.innerHTML =
    current.map(
      car => `

      <article class="iraq-card">

        <div class="iraq-car-photo">

          ${car.emoji}

        </div>


        <div class="iraq-card-info">

          <h3>
            ${car.brand}
            ${car.model}
          </h3>


          <div class="iraq-meta">

            ${car.year}
            •
            ${car.type}
            •
            ${car.fuel}

          </div>


          <div class="iraq-specs">

            <div class="iraq-spec">
              🔧 ${car.engine}
            </div>

            <div class="iraq-spec">
              ⚡ ${car.power} HP
            </div>

            <div class="iraq-spec">
              🪑 ${car.seats} مقاعد
            </div>

            <div class="iraq-spec">
              🚘 ${car.year}
            </div>

          </div>


          <div class="iraq-price">

            ${car.price.toFixed(1)}
            مليون د.ع

          </div>


          <div class="iraq-buttons">

            <button
              class="iraq-details"
              onclick="
                showNewCarDetails(${car.id})
              "
            >
              التفاصيل
            </button>


            <button
              class="iraq-fav"
              onclick="
                saveNewFavorite(${car.id})
              "
            >
              ❤️
            </button>

          </div>

        </div>

      </article>

    `
    ).join("");


  renderNewPagination(
    totalPages,
    page
  );

}


/* =========================================================
   PAGINATION
========================================================= */

function renderNewPagination(
  total,
  current
) {

  const box =
    document.getElementById(
      "iraqPagination"
    );


  if (total <= 1) {

    box.innerHTML = "";

    return;

  }


  let html = "";


  for (
    let i = 1;
    i <= total;
    i++
  ) {

    html += `

      <button
        class="
          iraq-page
          ${i === current ? "active" : ""}
        "
        onclick="
          renderNewCars(${i})
        "
      >
        ${i}
      </button>

    `;

  }


  box.innerHTML =
    html;

}

  let saved =

  if (
    saved.includes(id)
  ) {

    saved =
      saved.filter(
        x => x !== id
      );

    alert(
      "تم حذف السيارة من المفضلة"
    );

  } else {

    saved.push(id);

    alert(
      "❤️ تمت إضافة السيارة للمفضلة"
    );

  }


  localStorage.setItem(
    "iraqCarsFavoritesNew",
    JSON.stringify(saved)
  );

}
