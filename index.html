/* ==================================================

let filteredCars = [...cars];

let favorites = [];


/* ==================================================
   FORMAT PRICE
================================================== */

function formatPrice(price) {

  if (!price) {
    return "السعر غير متوفر";
  }

  return price + " مليون د.ع";

}


/* ==================================================
   LOAD FILTERS
================================================== */

function loadFilters() {

  const brandFilter =
    document.getElementById("brandFilter");

  const typeFilter =
    document.getElementById("typeFilter");

  const fuelFilter =
    document.getElementById("fuelFilter");

  const yearFilter =
    document.getElementById("yearFilter");


  if (!brandFilter) return;


  const brands = [
    ...new Set(
      cars.map(car => car.brand)
    )
  ];


  const types = [
    ...new Set(
      cars.map(car => car.type)
    )
  ];


  const fuels = [
    ...new Set(
      cars.map(car => car.fuel)
    )
  ];


  const years = [
    ...new Set(
      cars.map(car => car.year)
    )
  ];


  brands.forEach(brand => {

    brandFilter.innerHTML += `
      <option value="${brand}">
        ${brand}
      </option>
    `;

  });


  types.forEach(type => {

    typeFilter.innerHTML += `
      <option value="${type}">
        ${type}
      </option>
    `;

  });


  fuels.forEach(fuel => {

    fuelFilter.innerHTML += `
      <option value="${fuel}">
        ${fuel}
      </option>
    `;

  });


  years
    .sort((a, b) => b - a)
    .forEach(year => {

      yearFilter.innerHTML += `
        <option value="${year}">
          ${year}
        </option>
      `;

    });

}


/* ==================================================
   FILTER DATABASE
================================================== */

function filterDatabase() {

  const search =
    document
      .getElementById("databaseSearch")
      .value
      .toLowerCase()
      .trim();


  const brand =
    document.getElementById("brandFilter").value;


  const type =
    document.getElementById("typeFilter").value;


  const fuel =
    document.getElementById("fuelFilter").value;


  const year =
    document.getElementById("yearFilter").value;


  const price =
    document.getElementById("priceFilter").value;


  const sort =
    document.getElementById("sortFilter").value;


  let result = cars.filter(car => {

    const fullName =
      `${car.brand} ${car.model}`.toLowerCase();


    const matchesSearch =
      !search ||
      fullName.includes(search) ||
      car.engine.toLowerCase().includes(search);


    const matchesBrand =
      !brand || car.brand === brand;


    const matchesType =
      !type || car.type === type;


    const matchesFuel =
      !fuel || car.fuel === fuel;


    const matchesYear =
      !year || String(car.year) === year;


    let matchesPrice = true;


    if (price === "under30") {

      matchesPrice = car.price < 30;

    }


    if (price === "30-60") {

      matchesPrice =
        car.price >= 30 &&
        car.price <= 60;

    }


    if (price === "60-100") {

      matchesPrice =
        car.price > 60 &&
        car.price <= 100;

    }


    if (price === "over100") {

      matchesPrice = car.price > 100;

    }


    return (
      matchesSearch &&
      matchesBrand &&
      matchesType &&
      matchesFuel &&
      matchesYear &&
      matchesPrice
    );

  });


  /* SORT */

  if (sort === "priceLow") {

    result.sort(
      (a, b) => a.price - b.price
    );

  }


  if (sort === "priceHigh") {

    result.sort(
      (a, b) => b.price - a.price
    );

  }


  if (sort === "powerHigh") {

    result.sort(
      (a, b) => b.power - a.power
    );

  }


  if (sort === "yearNew") {

    result.sort(
      (a, b) => b.year - a.year
    );

  }


  filteredCars = result;

  renderDatabase(result);

}


/* ==================================================
   RENDER CARS
================================================== */

function renderDatabase(list) {

  const grid =

  const count =
    document.getElementById("resultsCount");


  if (!grid) return;


  if (count) {

    count.textContent =

  }


  if (list.length === 0) {

    grid.innerHTML = `

      <div class="no-results">

        <div>🔍</div>

        <h3>
          ما لقينا سيارة بهذا البحث
        </h3>

        <p style="color:#64748b;">
          جرّب تغير الشركة أو النوع أو السعر.
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML = list.map(car => {

    const isFavorite =
      favorites.includes(car.id);


    return `

      <div class="advanced-card">

        <div class="advanced-image">
          ${car.emoji}
        </div>


        <div class="advanced-info">

          <h3>
            ${car.brand} ${car.model}

            </div>


            <div class="spec-item">

              ${car.transmission}

            </div>


            <div class="spec-item">

              ${car.drive}

            </div>


            <div class="spec-item">

              ${car.seats}

            </div>


            <div class="spec-item">

              <strong>
                الصرفية
              </strong>

              ${
                car.consumption
                ? car.consumption + " كم/لتر"
                : "كهربائية"
              }

            </div>

          </div>


          <div
            class="car-price"
            style="margin-bottom:15px;"
          >

            ${formatPrice(car.price)}

          </div>


          <div class="card-actions">

            <button
              class="details-button"
              onclick="showCarDetails(${car.id})"

              التفاصيل

            </button>


            <button
              class="favorite-button"

            >

              ${
                isFavorite
                ? "❤️ محفوظة"
                : "♡ المفضلة"
              }

            </button>

          </div>

        </div>

      </div>

    `;

  }).join("");

}

}


/* ==================================================
   CLOSE MODAL
================================================== */

function closeModal() {

  const modal =
    document.getElementById("carModal");


  if (!modal) return;


  modal.style.display = "none";

  document.body.style.overflow = "auto";

}


/* ==================================================
   FAVORITES
================================================== */

function toggleFavorite(id) {

  const index =
    favorites.indexOf(id);


  if (index === -1) {

    favorites.push(id);

  } else {

    favorites.splice(index, 1);

  }


  renderDatabase(filteredCars);

}


/* ==================================================
   RESET FILTERS
================================================== */

function resetFilters() {

  const ids = [

    "databaseSearch",
    "brandFilter",
    "typeFilter",
    "fuelFilter",
    "yearFilter",
    "priceFilter",
    "sortFilter"

  ];


  ids.forEach(id => {

    const element =
      document.getElementById(id);


    if (element) {

      element.value = "";

    }

  });


  filterDatabase();

}


/* ==================================================
   HERO SEARCH
================================================== */

function searchCars() {

  const input =
    document.getElementById("searchInput");


  const databaseSearch =
    document.getElementById("databaseSearch");


  if (!input) return;


  const value =
    input.value.trim();


  if (databaseSearch) {

    databaseSearch.value = value;

    filterDatabase();

  }


  const database =
    document.getElementById("car-database");


  if (database) {

    database.scrollIntoView({
      behavior: "smooth"
    });

  }

}


/* ==================================================
   DARK MODE
================================================== */

function toggleTheme() {

  document.body.classList.toggle(
    "dark-mode"
  );


  const isDark =
    document.body.classList.contains(
      "dark-mode"
    );


  if (isDark) {

    document.body.style.background =
      "#020617";

    document.body.style.color =
      "#f8fafc";

  } else {

    document.body.style.background =
      "#f5f7fb";

    document.body.style.color =
      "#111827";

  }

}


/* ==================================================
   MODAL OUTSIDE CLICK
================================================== */

const carModal =
  document.getElementById("carModal");


if (carModal) {

  carModal.addEventListener(
    "click",
    function(event) {

      if (event.target === this) {

        closeModal();

      }

    }
  );

}


/* ==================================================
   START WEBSITE
================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadFilters();

    renderDatabase(cars);

  }
);
